# ============================================================
# SSD STUDIO — AUTONOMOUS CLIENT PIPELINE
# Detached, 24/7 orchestration stack.
#
# Run:    docker compose up -d --build
# Stop:   docker compose down
# Logs:   docker compose logs -f <service>
#
# NOTE: Redis has been intentionally removed. Booking concurrency is
# guaranteed at the database layer via a UNIQUE constraint on the slot
# plus SELECT ... FOR UPDATE transactions in Prisma (no application-level
# locking). See packages/db/prisma/schema.prisma.
# ============================================================

networks:
  ssd_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local

services:
  # ----------------------------------------------------------
  # PostgreSQL — primary relational database
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ssd_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssd_password}
      POSTGRES_DB: ${POSTGRES_DB:-ssd_studio_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/db/init:/docker-entrypoint-initdb.d
    networks:
      - ssd_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssd_user} -d ${POSTGRES_DB:-ssd_studio_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------
  # API — Express backend (JWT auth, bookings, webhooks)
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: ssd_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=${DATABASE_URL:-postgresql://ssd_user:ssd_password@postgres:5432/ssd_studio_db}
      - JWT_SECRET=${JWT_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - AWS_REGION=${AWS_REGION}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - WEBHOOK_INTERNAL_SECRET=${WEBHOOK_INTERNAL_SECRET}
      - N8N_WEBHOOK_BASE_URL=${N8N_WEBHOOK_BASE_URL:-http://n8n:5678}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ADMIN_WHATSAPP_TO=${ADMIN_WHATSAPP_TO}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
    ports:
      - "${API_PORT:-4000}:4000"
    networks:
      - ssd_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # Web — Next.js 16 client booking frontend
  # ----------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: ssd_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - ssd_network
    depends_on:
      - api

  # ----------------------------------------------------------
  # n8n — workflow orchestration engine
  # ----------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: ssd_n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB:-n8n_db}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-ssd_user}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-ssd_password}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me-32-char-key}
      - GENERIC_TIMEZONE=${TIMEZONE:-America/New_York}
      - API_BASE_URL=${API_BASE_URL:-http://api:4000}
      - WEBHOOK_INTERNAL_SECRET=${WEBHOOK_INTERNAL_SECRET}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - REVIEW_URL=${REVIEW_URL}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./apps/orchestration/workflows:/home/node/.n8n/workflows
    networks:
      - ssd_network
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------
  # FastMCP Agent Server — Python SSE-based MCP server
  # Exposes @mcp.tool() endpoints for the operating agent (OpenClaw).
  # ----------------------------------------------------------
  fastmcp:
    build:
      context: ./apps/agents
      dockerfile: Dockerfile
    container_name: ssd_fastmcp
    restart: unless-stopped
    command: ["python", "server.py"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://ssd_user:ssd_password@postgres:5432/ssd_studio_db}
      - AGENT_HOST=0.0.0.0
      - AGENT_PORT=${AGENT_PORT:-8080}
      - API_BASE_URL=${API_BASE_URL:-http://api:4000}
      - WEBHOOK_INTERNAL_SECRET=${WEBHOOK_INTERNAL_SECRET}
      - HITL_HMAC_SECRET=${HITL_HMAC_SECRET}
    ports:
      - "${AGENT_PORT:-8080}:8080"
    networks:
      - ssd_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ----------------------------------------------------------
  # Monitor — self-healing resilience daemon
  # Polls n8n REST API + system_logs, retries failed executions
  # with exponential backoff + circuit breaker, alerts admin on failure.
  # ----------------------------------------------------------
  monitor:
    build:
      context: ./apps/agents
      dockerfile: Dockerfile
    container_name: ssd_monitor
    restart: unless-stopped
    command: ["python", "monitor.py"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://ssd_user:ssd_password@postgres:5432/ssd_studio_db}
      - API_BASE_URL=${API_BASE_URL:-http://api:4000}
      - N8N_BASE_URL=${N8N_BASE_URL:-http://n8n:5678}
      - N8N_API_KEY=${N8N_API_KEY}
      - WEBHOOK_INTERNAL_SECRET=${WEBHOOK_INTERNAL_SECRET}
      - MONITOR_POLL_INTERVAL=${MONITOR_POLL_INTERVAL:-60}
      - MONITOR_MAX_RETRIES=${MONITOR_MAX_RETRIES:-3}
      - MONITOR_CIRCUIT_THRESHOLD=${MONITOR_CIRCUIT_THRESHOLD:-5}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ADMIN_WHATSAPP_TO=${ADMIN_WHATSAPP_TO}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_WHATSAPP_FROM=${TWILIO_WHATSAPP_FROM}
    networks:
      - ssd_network
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started
